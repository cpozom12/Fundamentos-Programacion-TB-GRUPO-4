name: Generar presentación corregida

# 2026-10-08: se quitó push (minutos de Actions agotados).
# No es un test: genera el pptx y lo vuelve a subir. Queda workflow_dispatch.
# No se copió a Cloud Build: el job hace git push y gastaría.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar-pptx:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: entrega-final-v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencia
        run: python -m pip install --disable-pip-version-check python-pptx

      - name: Generar PowerPoint
        run: python generar_presentacion.py

      - name: Registrar PowerPoint generado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add TF-GRUPO4_v2_CORREGIDO.pptx
          if git diff --cached --quiet; then
            echo "La presentación ya está actualizada."
          else
            git commit -m "build: genera presentación corregida"
            git push origin HEAD:entrega-final-v4
          fi
